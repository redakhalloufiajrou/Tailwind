<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
    <header id="header">
        <div class="logo">
            <p>Café Aroma</p>
        </div>

        <nav class="menu">
            <a href="">Inicio</a>
            <a href="">Carta</a>
            <a href="">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>El mejor café de tu barrio</h1>
            <p>Recién tostado cada mañana, con mucho cariño.</p>
            <a href="">Ver la carta</a>
        </section>
        <section>
            <h2>Nuestros cafés</h2>
            <figure>
                <img src="img/espresso.png" alt="">
                <h3>Espresso</h3>
                <p>Intenso y con mucho cuerpo</p>
                <p>1,50€</p>
            </figure>
            <figure>
                <img src="img/capuchino.png" alt="">
                <h3>Capuchino</h3>
                <p>Suave, con espuma de leche</p>
                <p>2,20€</p>
            </figure>
            <figure>
                <img src="img/cafe-con-hielo.png" alt="">
                <h3>Café con hielo</h3>
                <p>Perfecto para el verano</p>
                <p>2,00€</p>
            </figure>
        </section>
        <section>
            <div>
                <img src="img/cafeteria.png" alt="">
            </div>
            <div>
                <h3>Sobre nosotros</h3>
                <p>Somos una cafeteria familiar abierta desde 2010. Tostamos nuestro propio café y preparamos cada taza con calma</p>
            </div>
        </section>
    </main>
</body>
</html>
